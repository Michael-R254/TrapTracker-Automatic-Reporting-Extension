<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 664" width="520" height="664" role="img" aria-label="Decision flow resolving one record's time. Three guard conditions on the filename each fall back to the same handler; a successful decode converts Europe London local time to UTC and is labelled filename block d. A separate scope check sets a validation flag without changing the stored time. The fallback handler yields either send time fallback or, with no send time at all, none, which leaves the record undated.">

  <rect x="0" y="0" width="520" height="664" fill="#FFFFFF"/>

  <defs>
    <marker id="ar" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#46564E"/>
    </marker>
    <marker id="ar-o" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#91560A"/>
    </marker>
    <marker id="ar-p" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1B5C51"/>
    </marker>
  </defs>

  <text x="14" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#101A16">Resolving one record's time</text>
  <text x="14" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#46564E">sources/capture_time.py — never drops the record, never invents a time</text>

  <!-- ================= left column: recovery attempt ================= -->
  <rect x="14" y="50" width="244" height="34" fill="#F8FAF7" stroke="#46564E" stroke-width="1.25"/>
  <text x="24" y="66" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#101A16">parse_capture_time()</text>
  <text x="24" y="78" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">filename, send_time_utc</text>

  <line x1="136" y1="84" x2="136" y2="100" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <rect x="14" y="100" width="244" height="28" fill="#F8FAF7" stroke="#46564E" stroke-width="1.25"/>
  <text x="24" y="119" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#101A16">filename present?</text>
  <text x="248" y="119" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#91560A">no →</text>

  <line x1="136" y1="128" x2="136" y2="144" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <rect x="14" y="144" width="244" height="40" fill="#F8FAF7" stroke="#46564E" stroke-width="1.25"/>
  <text x="24" y="161" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#101A16">block D matches?</text>
  <text x="24" y="176" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">_D_BLOCK_RE — anchored, matches D only</text>
  <text x="248" y="161" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#91560A">no →</text>

  <line x1="136" y1="184" x2="136" y2="200" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <rect x="14" y="200" width="244" height="28" fill="#F8FAF7" stroke="#46564E" stroke-width="1.25"/>
  <text x="24" y="219" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#101A16">17 digits a real calendar time?</text>
  <text x="248" y="219" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#91560A">no →</text>

  <line x1="136" y1="228" x2="136" y2="244" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <rect x="14" y="244" width="244" height="44" fill="#DCEBE5" stroke="#1B5C51" stroke-width="1.25"/>
  <text x="24" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#101A16">Europe/London local &#8594; UTC</text>
  <text x="24" y="278" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#1B5C51">zoneinfo, real DST rules — never a fixed offset</text>

  <line x1="136" y1="288" x2="136" y2="304" stroke="#1B5C51" stroke-width="1.25" marker-end="url(#ar-p)"/>

  <rect x="14" y="304" width="244" height="28" fill="#DCEBE5" stroke="#1B5C51" stroke-width="1.5"/>
  <text x="24" y="323" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1B5C51">capture_time_source = "filename_block_d"</text>

  <line x1="136" y1="332" x2="136" y2="348" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <!-- scope check -->
  <rect x="14" y="348" width="244" height="76" fill="#F8FAF7" stroke="#46564E" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="24" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#101A16">scope check — disclosure only</text>
  <text x="24" y="381" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#46564E">offset == +01:00 (BST)?</text>
  <text x="24" y="394" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#46564E">not DST-ambiguous, not in the spring gap?</text>
  <text x="24" y="407" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#46564E">capture &#8804; send? (later is impossible)</text>
  <text x="24" y="419" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">the decoded time is kept either way</text>

  <line x1="76"  y1="424" x2="76"  y2="440" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>
  <line x1="196" y1="424" x2="196" y2="440" stroke="#46564E" stroke-width="1.25" marker-end="url(#ar)"/>

  <rect x="14" y="440" width="120" height="42" fill="#DCEBE5" stroke="#1B5C51" stroke-width="1.25"/>
  <text x="24" y="457" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1B5C51">tz_validated = 1</text>
  <text x="24" y="471" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">note = NULL</text>

  <rect x="138" y="440" width="120" height="42" fill="#F4E6CD" stroke="#91560A" stroke-width="1.25"/>
  <text x="148" y="457" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#91560A">tz_validated = 0</text>
  <text x="148" y="471" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">reason in note</text>

  <!-- ================= right rail: the fallback handler ================= -->
  <path d="M258,114 L272,114 L272,232" fill="none" stroke="#91560A" stroke-width="1.25"/>
  <path d="M258,158 L272,158" fill="none" stroke="#91560A" stroke-width="1.25"/>
  <path d="M258,214 L272,214" fill="none" stroke="#91560A" stroke-width="1.25"/>
  <path d="M272,232 L286,232" fill="none" stroke="#91560A" stroke-width="1.25" marker-end="url(#ar-o)"/>

  <rect x="290" y="214" width="216" height="36" fill="#F4E6CD" stroke="#91560A" stroke-width="1.25"/>
  <text x="300" y="231" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#101A16">_fallback(send_time_utc, why)</text>
  <text x="300" y="244" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#91560A">one handler, all three guard failures</text>

  <line x1="345" y1="250" x2="345" y2="268" stroke="#91560A" stroke-width="1.25" marker-end="url(#ar-o)"/>
  <line x1="451" y1="250" x2="451" y2="268" stroke="#91560A" stroke-width="1.25" marker-end="url(#ar-o)"/>

  <rect x="290" y="268" width="106" height="72" fill="#F4E6CD" stroke="#91560A" stroke-width="1.25"/>
  <text x="298" y="284" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">send time exists</text>
  <text x="298" y="300" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#91560A">"send_time_</text>
  <text x="298" y="312" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#91560A">fallback"</text>
  <text x="298" y="328" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#46564E">capture col holds</text>
  <text x="298" y="337" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#46564E">the SEND time</text>

  <rect x="400" y="268" width="106" height="72" fill="#F8FAF7" stroke="#7E8C84" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="408" y="284" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#7E8C84">no send time</text>
  <text x="408" y="300" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#46564E">"none"</text>
  <text x="408" y="316" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#46564E">capture col NULL</text>
  <text x="408" y="328" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#46564E">record retained,</text>
  <text x="408" y="337" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#46564E">flagged undated</text>

  <!-- callouts -->
  <rect x="290" y="356" width="216" height="58" fill="#FFFFFF" stroke="#C2CFC4" stroke-width="1"/>
  <text x="298" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="bold" fill="#101A16">tz_validated is not a fallback trigger.</text>
  <text x="298" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">An unvalidated decode &#8212; winter GMT, a DST</text>
  <text x="298" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">edge, a capture later than its own send &#8212; is</text>
  <text x="298" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">still stored and still used to place the day.</text>

  <rect x="290" y="424" width="216" height="44" fill="#FFFFFF" stroke="#C2CFC4" stroke-width="1"/>
  <text x="298" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">event_time_utc holds the send time on</text>
  <text x="298" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">every row and is never overwritten, whichever</text>
  <text x="298" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">branch is taken.</text>

  <!-- ================= bottom band: what each label means downstream ================= -->
  <line x1="14" y1="500" x2="506" y2="500" stroke="#C2CFC4" stroke-width="1"/>
  <text x="14" y="518" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#101A16">effective_time_utc = COALESCE(capture_time_utc, event_time_utc)</text>
  <text x="14" y="531" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#7E8C84">defined once in repository.py, mirrored on PersistedEvent — window selection and day bucketing cannot drift apart</text>

  <rect x="14" y="542" width="158" height="86" fill="#DCEBE5" stroke="#1B5C51" stroke-width="1.25"/>
  <text x="22" y="559" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#1B5C51">filename_block_d</text>
  <text x="22" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">day_basis = "capture"</text>
  <text x="22" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">Placed on the day the</text>
  <text x="22" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">camera recorded it.</text>
  <text x="22" y="621" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#7E8C84">Counted in the window.</text>

  <rect x="181" y="542" width="158" height="86" fill="#F4E6CD" stroke="#91560A" stroke-width="1.25"/>
  <text x="189" y="559" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#91560A">send_time_fallback</text>
  <text x="189" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">day_basis = "send"</text>
  <text x="189" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">Placed on delivery day,</text>
  <text x="189" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">substitution disclosed.</text>
  <text x="189" y="621" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#7E8C84">Counted in the window.</text>

  <rect x="348" y="542" width="158" height="86" fill="#F8FAF7" stroke="#7E8C84" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="356" y="559" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#46564E">none</text>
  <text x="356" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">effective time is NULL</text>
  <text x="356" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">Outside every windowed</text>
  <text x="356" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">query, never dropped.</text>
  <text x="356" y="621" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#7E8C84">count_undated() discloses.</text>

  <text x="14" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#46564E">Calendar days are local (Europe/London); instants stay UTC. The monitoring window and its equal-length preceding baseline share that clock.</text>

</svg>
