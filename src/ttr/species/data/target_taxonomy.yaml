# Higher-rank taxonomy for the alias table's species (Phase 3 cross-check design).
#
# WHY THIS EXISTS. The binary cross-check verdict is species-level only, but every
# DISAGREEMENT is additionally classified by how FAR apart the two identifications
# are (same genus / same family / ... / different kingdom). That distance needs the
# upstream target's higher ranks, which the alias table — keyed on the binomial —
# does not carry.
#
# PROVENANCE. These 26 lineages are standard Linnaean placements, entered here by
# hand and cross-checked against the ranks BioCLIP itself reports, so that the two
# sides of a comparison are ranked on the same backbone. This file is NOT a copy or
# derivative of the TreeOfLife-10M label table: it is 26 rows of public-domain
# taxonomic fact, which keeps LICENSING_REVIEW.md §4 true ("this repository
# redistributes no weights and vendors no model code"). The PREDICTION's ranks are
# never looked up here — they come from BioCLIP's own output (see
# `bioclip_enricher._to_topk`), which is why no full taxonomy is vendored.
#
# NOTE ON `order`. BioCLIP's backbone places hedgehogs in Erinaceomorpha rather
# than the now-usual Eulipotyphla. The value below matches BioCLIP so an
# order-level comparison is like-for-like; it is a backbone convention, not a
# taxonomic claim by this project.
#
# Keys MUST match the alias table's canonical binomial keys exactly. Reserved
# 'nonbio:' classes (Person/Car/CalibrationPole) are absent on purpose — they have
# no lineage, and are reported as not-evaluable rather than compared.

Erinaceus europaeus:  {kingdom: Animalia, phylum: Chordata, class: Mammalia, order: Erinaceomorpha, family: Erinaceidae, genus: Erinaceus}
